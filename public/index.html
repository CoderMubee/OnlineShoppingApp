<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

  <header class="header">

    <!-- Logo -->
    <div class="logo">
      <h2>ShopEase</h2>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" placeholder="Search products...">
      <button>Search</button>
    </div>

    <!-- Navigation -->
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Deals</a>
      <a href="#">Contact</a>
    </nav>

    <!-- Icons -->
    <div class="header-icons">
      <a href="/html/orders.html" class="icon-btn">
        <span>📦</span>
      </a>
      <a href="/html/cart.html" class="icon-btn cart-icon">
        <span>🛒</span>
        <span class="cart-badge">0</span>
      </a>

      <div class="user-account">
        <div class="user-status hidden">
          <span>Logged in</span>
          <span class="dropdown-arrow">▾</span>
        </div>


        <a href="/login" class="icon-btn user-login"><span>👤</span></a>

        <div class="user-dropdown hidden">
          <a href="#">Profile</a>
          <a href="#">Orders</a>
          <button class="logout-btn">Logout</button>
        </div>
      </div>
    </div>

  </header>


  <div class="store__layout">
    <aside>
      <p>hi</p>
    </aside>
    <!-- Product Grid -->
    <main class="products">
      <div class="products__grid">
        <!-- Repeat product-card blocks as needed -->
      </div>
    </main>

    <aside>
      <p>hi</p>
    </aside>
  </div>
  <footer class="footer">
    <div class="footer__container">
      <div class="footer__info">
        <p class="footer__text"><strong>HEAD OFFICE</strong></p>
        <p class="footer__text">No. 44, Brown Road, Aguda Surulere, Lagos</p>
        <p class="footer__text" style="color: var(--gold); margin-top: 10px;"><a
            href="tel:+2348160228814">+234-816-022-8814</a></p>
      </div>
      <div class="footer__social">
        <a href="#"><img src="icons/whatsapp-50.png" alt="WhatsApp icon"></a>
        <a href="#"><img src="icons/facebook-50.png" alt="Facebook icon"></a>
        <a href="#"><img src="icons/email-50.png" alt="email icon"></a>
        <a href="#"><img src="icons/x-50.png" alt="X icon"></a>
        <a href="#"><img src="icons/linkedIn-50.png" alt="linkedIn icon"></a>
      </div>
    </div>
    <div class="footer__advert">
      <p>Handcrafted by Msquare &bull; 2024</p>
    </div>
  </footer>
  <div class="product-modal modal-hidden">
    <div class="product-modal__content">

      <span class="close-modal">&times;</span>

      <img class="modal-image" />

      <div class="modal-info">
        <h2 class="modal-name"></h2>
        <p class="modal-price"></p>
      </div>

      <div class="modal-actions">
        <button class="add-cart-btn">Add to Cart</button>
        <button class="view-more-btn">View More</button>
      </div>

    </div>
  </div>
  <script src="../js/script.js"></script>
</body>

</html>
